name: Image

on:
  # The host checks take minutes and catch the things that used to reach a
  # board: a script that does not parse, a patch that stopped applying, a
  # bashism in a file busybox sh has to run. Those run on every push. The
  # full image build stays manual.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Full image ${{ matrix.run }}
    # Manual only, as the comment at the top says.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        run: [1]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Give git an identity
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          test -n "$(git config user.name)"
          test -n "$(git config user.email)"

      - name: Build everything from pinned sources
        run: JOBS=$(nproc) bash build/reproduce.sh

      - name: Report the disk left
        if: always()
        run: df -h /

      - name: Locate the artifacts
        id: out
        run: |
          dir=$(ls -dt build-output/reproduce.*/artifacts | head -1)

          test -d "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Verify the checksums
        working-directory: ${{ steps.out.outputs.dir }}
        run: sha256sum -c SHA256SUMS

      - name: Report what was built
        run: |
          {
            echo "## Build ${{ matrix.run }}"
            echo
            echo "Source commit \`${{ github.sha }}\`. Board verification stays"
            echo "pending: this runner has no hardware attached."
            echo
            echo '```'
            cat "${{ steps.out.outputs.dir }}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the images
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.run }}
          path: ${{ steps.out.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.run }}
          path: build-output/reproduce.*/logs/
          if-no-files-found: warn
          retention-days: 14
